services:
    mssqlServer:
        container_name: mssqlServer
        image: mcr.microsoft.com/mssql/server:2022-latest
        restart: always
        ports:
            - "1433:1433"
        environment:
            ACCEPT_EULA: "Y"
            SA_PASSWORD: "${SA_PASSWORD:-!Password}"
            MSSQL_RPC_PORT: "135"
            MSSQL_DTC_TCP_PORT: "51000"
